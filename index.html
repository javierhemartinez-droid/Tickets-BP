<style>
  :root{
    --bg:#090d15;
    --bg-raised:#10151f;
    --bg-card:#141a27;
    --line:#212940;
    --ink:#e9e8e3;
    --ink-dim:#8a8f9a;
    --stub:#f2b705;
    --stub-dim:#7a6512;
    --teal:#3fc4d6;
    --teal-dim:#1c5860;
    --violet:#8b8bf5;
    --violet-dim:#33356e;
    --ok:#34d399;
    --bad:#ef4444;
    --wait:#8a8f9a;
    --radius:16px;
    font-size:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    min-height:100vh;
    padding-bottom:24px;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:0.03em;}
  button{font-family:inherit;}

  /* ---- Header (fijo, minimal) ---- */
  header{
    padding:6px 20px;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    border-bottom:1px solid var(--line);
  }
  header .logo-img{height:150px;width:auto;display:block;max-width:calc(100% - 100px);object-fit:contain;}
  #backBtn{
    display:none;
    position:absolute;left:16px;top:50%;transform:translateY(-50%);
    background:var(--bg-raised);border:1px solid var(--line);
    color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    font-size:1.1rem;
    align-items:center;justify-content:center;
  }
  #backBtn.show{display:flex;}
  #connWrap{
    position:absolute;right:16px;top:50%;transform:translateY(-50%);
    display:flex;align-items:center;gap:6px;
  }
  #connStatus{font-size:0.7rem;color:var(--ink-dim);}
  #pendingBadge{
    display:none;font-size:0.62rem;color:var(--stub);
    border:1px solid var(--stub-dim);padding:2px 7px;border-radius:10px;
  }

  main{padding:16px 16px 90px;}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- HOME: panel de eventos ---- */
  .home-topbar{
    display:flex;justify-content:space-between;align-items:center;
    margin-bottom:16px;
  }
  .home-topbar h2{
    font-size:0.78rem;text-transform:uppercase;letter-spacing:0.1em;
    color:var(--ink-dim);margin:0;font-weight:700;
  }
  .btn-new-event{
    background:var(--stub);color:#1a1305;
    border:none;border-radius:10px;
    padding:10px 16px;font-weight:800;font-size:0.85rem;
  }

  .event-card{
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:14px;
    padding:16px;
    margin-bottom:12px;
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .event-card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .event-card .ev-name{font-weight:800;font-size:1.02rem;line-height:1.25;}
  .event-thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;flex-shrink:0;}
  .event-card .ev-date{color:var(--ink-dim);font-size:0.78rem;margin-top:3px;}
  .status-pill{
    font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;
    padding:4px 10px;border-radius:20px;white-space:nowrap;
  }
  .status-pill.upcoming{background:rgba(242,183,5,0.14);color:var(--stub);}
  .status-pill.live{background:rgba(52,211,153,0.14);color:var(--ok);}
  .status-pill.closed{background:rgba(138,143,154,0.14);color:var(--ink-dim);}

  .event-card .metrics{display:flex;gap:18px;}
  .event-card .metric .n{font-size:1.15rem;font-weight:800;}
  .event-card .metric .l{font-size:0.65rem;color:var(--ink-dim);text-transform:uppercase;letter-spacing:0.04em;}

  .empty-state{
    text-align:center;padding:60px 20px;color:var(--ink-dim);
  }
  .empty-state .ic{font-size:2rem;margin-bottom:10px;}
  .empty-state .t{font-size:0.9rem;}

  /* ---- EVENT DETAIL ---- */
  .event-head{margin-bottom:16px;}
  .event-head .ev-name{font-size:1.15rem;font-weight:800;}
  .event-head .ev-meta{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .event-head .ev-date{color:var(--ink-dim);font-size:0.8rem;}

  .tabbar{
    display:flex;
    background:var(--bg-raised);
    border:1px solid var(--line);
    border-radius:12px;
    padding:4px;
    margin-bottom:18px;
    gap:2px;
    overflow-x:auto;
  }
  .tabbar button{
    flex:1;min-width:70px;
    background:none;border:none;color:var(--ink-dim);
    padding:9px 6px;border-radius:9px;
    font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.02em;
    white-space:nowrap;
  }
  .tabbar button.active{background:var(--stub);color:#1a1305;}

  .tabpanel{display:none;}
  .tabpanel.active{display:block;}

  /* ---- Venta ---- */
  .field{margin-bottom:16px;}
  .field label{
    display:block;font-size:0.75rem;text-transform:uppercase;letter-spacing:0.08em;
    color:var(--ink-dim);margin-bottom:6px;
  }
  .field input{
    width:100%;background:var(--bg-raised);border:1px solid var(--line);color:var(--ink);
    padding:14px;border-radius:12px;font-size:1rem;
  }
  .field input:focus{outline:none;border-color:var(--stub);}

  .btn{
    width:100%;padding:15px;border-radius:12px;border:none;
    font-size:0.95rem;font-weight:700;letter-spacing:0.02em;text-transform:uppercase;
  }
  .btn-primary{background:var(--stub);color:#1a1305;}
  .btn-secondary{background:var(--bg-raised);color:var(--ink);border:1px solid var(--line);}
  .btn-ghost{background:transparent;color:var(--ink-dim);border:1px dashed var(--line);}

  #ticketResult{display:none;margin-top:22px;}
  .batch-nav{
    display:flex;align-items:center;justify-content:center;gap:16px;
    margin-bottom:12px;color:var(--ink-dim);font-size:0.85rem;font-weight:700;
  }
  .batch-nav-btn{
    background:var(--bg-raised);border:1px solid var(--line);color:var(--teal);
    width:32px;height:32px;border-radius:9px;font-size:1.1rem;
  }
  .batch-nav-btn:disabled{opacity:0.3;}
  .stub{
    background:var(--bg-raised);border:1px solid var(--line);border-radius:var(--radius);
    padding:24px 20px;position:relative;text-align:center;overflow:hidden;
  }
  .stub::before,.stub::after{
    content:"";position:absolute;width:24px;height:24px;background:var(--bg);
    border-radius:50%;top:50%;transform:translateY(-50%);
  }
  .stub::before{left:-12px;}
  .stub::after{right:-12px;}
  .stub-divider{border-top:2px dashed var(--line);margin:20px -8px;}
  .stub-event{font-size:1.35rem;font-weight:800;line-height:1.25;margin-bottom:6px;}
  .stub-meta{font-size:0.78rem;color:var(--ink-dim);margin-bottom:16px;}
  .stub-buyer-label{font-size:0.65rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-dim);margin-bottom:2px;}
  .stub-name{font-size:1.05rem;font-weight:600;color:var(--stub);margin-bottom:16px;}
  #qrcode{display:flex;justify-content:center;margin:8px 0 16px;}
  #qrcode img,#qrcode canvas,.resend-qr img,.resend-qr canvas{border-radius:8px;background:#fff;padding:8px;}
  .stub-code{font-size:0.8rem;color:var(--ink-dim);}
  .stub-actions{display:flex;gap:10px;margin-top:20px;}
  .stub-actions .btn{flex:1;}

  /* ---- Compradores ---- */
  .search-wrap{margin-bottom:14px;}
  .search-wrap input{
    width:100%;background:var(--bg-raised);border:1px solid var(--line);color:var(--ink);
    padding:12px 14px;border-radius:12px;font-size:0.9rem;
  }
  .buyer-list{border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .buyer-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 14px;border-bottom:1px solid var(--line);gap:10px;
  }
  .buyer-row:last-child{border-bottom:none;}
  .buyer-row .info{min-width:0;}
  .buyer-row .name{font-size:0.92rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .buyer-row .code{font-size:0.7rem;color:var(--ink-dim);margin-top:2px;}
  .buyer-row .actions{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .badge{font-size:0.62rem;text-transform:uppercase;padding:3px 8px;border-radius:20px;font-weight:700;white-space:nowrap;}
  .badge.used{background:rgba(52,211,153,0.15);color:var(--ok);}
  .badge.unused{background:rgba(138,143,154,0.15);color:var(--ink-dim);}
  .badge.cortesia{background:var(--violet-dim);color:var(--violet);}
  .cortesia-toggle{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px;margin-bottom:16px;
    background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;
    font-size:0.85rem;color:var(--ink-dim);
  }
  .cortesia-toggle input{width:18px;height:18px;accent-color:var(--violet);flex-shrink:0;}
  .cortesia-toggle:has(input:checked){border-color:var(--violet);color:var(--ink);}
  .resend-btn{
    background:var(--bg-raised);border:1px solid var(--line);color:var(--teal);
    width:34px;height:34px;border-radius:9px;font-size:0.95rem;
    display:flex;align-items:center;justify-content:center;
  }
  .delete-btn{
    background:var(--bg-raised);border:1px solid var(--line);color:var(--bad);
    width:34px;height:34px;border-radius:9px;font-size:0.9rem;
    display:flex;align-items:center;justify-content:center;
  }

  /* ---- Escanear ---- */
  #reader{border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);margin-bottom:16px;}
  #scanResult{
    display:none;border-radius:var(--radius);padding:28px 20px;text-align:center;
    font-weight:800;font-size:1.4rem;
  }
  #scanResult.ok{background:rgba(52,211,153,0.12);color:var(--ok);border:1px solid var(--ok);}
  #scanResult.bad{background:rgba(239,68,68,0.12);color:var(--bad);border:1px solid var(--bad);}
  #scanResult .sub{font-size:0.85rem;font-weight:500;margin-top:8px;color:var(--ink-dim);}
  #scanAgainBtn{margin-top:16px;}
  #scanLock{
    display:none;text-align:center;padding:48px 20px;
    border:1px solid var(--line);border-radius:var(--radius);background:var(--bg-raised);
  }
  #scanLock .ic{font-size:2.2rem;margin-bottom:12px;}
  #scanLock .title{font-weight:800;font-size:1.05rem;margin-bottom:8px;}
  #scanLock .sub{color:var(--ink-dim);font-size:0.85rem;line-height:1.5;}
  #scanLock .sub b{color:var(--stub);}

  /* ---- Stats ---- */
  .stat-row{display:flex;gap:12px;margin-bottom:20px;}
  .stat{flex:1;background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;padding:16px;text-align:center;}
  .stat .n{font-size:1.6rem;font-weight:800;color:var(--stub);}
  .stat .l{font-size:0.7rem;text-transform:uppercase;color:var(--ink-dim);letter-spacing:0.06em;}
  .progress-wrap{background:var(--bg-raised);border:1px solid var(--line);border-radius:12px;padding:16px;}
  .progress-wrap .plabel{display:flex;justify-content:space-between;font-size:0.75rem;color:var(--ink-dim);margin-bottom:8px;}
  .progress-bar{height:8px;background:var(--bg);border-radius:6px;overflow:hidden;}
  .progress-bar .fill{height:100%;background:var(--ok);}

  /* ---- Modal nuevo evento ---- */
  .modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:50;align-items:flex-end;}
  .modal{
    background:var(--bg-raised);width:100%;border-radius:20px 20px 0 0;
    padding:24px 20px calc(24px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  }
  .modal h2{margin:0 0 16px;font-size:1rem;color:var(--stub);text-transform:uppercase;letter-spacing:0.06em;}

  #toast{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    background:var(--bg-raised);border:1px solid var(--line);padding:10px 18px;border-radius:30px;
    font-size:0.85rem;z-index:100;display:none;
  }
</style>
</head>

<main>

  <!-- ================= HOME ================= -->
  <div class="view active" id="view-home">
    <div class="home-topbar">
      <h2>Eventos</h2>
      <button class="btn-new-event" id="newEventBtn">＋ Nuevo evento</button>
    </div>
    <div id="eventList"></div>
  </div>

  <!-- ================= EVENT DETAIL ================= -->
  <div class="view" id="view-event">
    <div class="event-head" style="display:flex;gap:14px;align-items:center;">
      <img id="evHeadImg" class="event-thumb" style="display:none;width:56px;height:56px;">
      <div style="min-width:0;flex:1;">
        <div class="ev-name" id="evHeadName"></div>
        <div class="ev-meta">
          <div class="ev-date" id="evHeadDate"></div>
          <span class="status-pill" id="evHeadStatus"></span>
        </div>
      </div>
      <button id="editEventBtn" class="batch-nav-btn" title="Editar evento" style="width:38px;height:38px;">✎</button>
    </div>

    <div class="tabbar">
      <button class="active" data-tab="venta">Venta</button>
      <button data-tab="compradores">Compradores</button>
      <button data-tab="escanear">Escanear</button>
      <button data-tab="stats">Stats</button>
    </div>

    <!-- Venta / Generar entrada -->
    <div class="tabpanel active" id="tab-venta">
      <div class="field">
        <label>Nombre del comprador</label>
        <input type="text" id="buyerName" placeholder="Ej: Marisa Ferreyra" autocomplete="off">
      </div>
      <div class="field">
        <label>Contacto (opcional)</label>
        <input type="text" id="buyerContacto" placeholder="Email o WhatsApp" autocomplete="off">
      </div>
      <div class="field">
        <label>Cantidad de entradas</label>
        <input type="number" id="buyerCantidad" value="1" min="1" max="50">
      </div>
      <label class="cortesia-toggle">
        <input type="checkbox" id="buyerCortesia">
        <span>Invitado especial (cortesía, sin cargo)</span>
      </label>
      <button class="btn btn-primary" id="genBtn">Registrar venta y generar entrada</button>

      <div id="ticketResult">
        <div class="batch-nav" id="batchNav" style="display:none;">
          <button class="batch-nav-btn" id="batchPrevBtn">‹</button>
          <span id="batchLabel">1 / 1</span>
          <button class="batch-nav-btn" id="batchNextBtn">›</button>
        </div>
        <div class="stub">
          <img id="resImg" style="display:none;width:72px;height:72px;border-radius:12px;object-fit:cover;margin:0 auto 12px;">
          <div class="stub-event" id="resEvent"></div>
          <div class="stub-meta" id="resMeta"></div>
          <span class="badge cortesia" id="resCortesia" style="display:none;margin-bottom:12px;">Cortesía</span>
          <div class="stub-buyer-label">Entrada de</div>
          <div class="stub-name" id="resName"></div>
          <div id="qrcode"></div>
          <div class="stub-divider"></div>
          <div class="stub-code mono" id="resCode"></div>
        </div>
        <div class="stub-actions">
          <button class="btn btn-secondary" id="dlBtn">PNG</button>
          <button class="btn btn-secondary" id="pdfBtn">PDF</button>
          <button class="btn btn-primary" id="shareBtn">Compartir</button>
        </div>
        <button class="btn btn-ghost" id="anotherBtn" style="margin-top:14px;">Registrar otra venta</button>
      </div>
    </div>


    <!-- Compradores -->
    <div class="tabpanel" id="tab-compradores">
      <div class="search-wrap">
        <input type="text" id="buyerSearch" placeholder="Buscar comprador...">
      </div>
      <div class="buyer-list" id="buyerList"></div>
    </div>

    <!-- Escanear -->
    <div class="tabpanel" id="tab-escanear">
      <div id="scanLock">
        <div class="ic">🔒</div>
        <div class="title" id="scanLockTitle">Escáner bloqueado</div>
        <div class="sub" id="scanLockSub"></div>
      </div>
      <div id="reader"></div>
      <div id="scanResult"></div>
      <button class="btn btn-secondary" id="scanAgainBtn" style="display:none;">Escanear otra</button>
    </div>

    <!-- Stats -->
    <div class="tabpanel" id="tab-stats">
      <div class="stat-row">
        <div class="stat"><div class="n" id="statTotal">0</div><div class="l">Vendidas</div></div>
        <div class="stat"><div class="n" id="statUsed">0</div><div class="l">Ingresaron</div></div>
        <div class="stat"><div class="n" id="statPending">0</div><div class="l">Pendientes</div></div>
      </div>
      <div class="progress-wrap">
        <div class="plabel"><span>Check-in</span><span id="statPct">0%</span></div>
        <div class="progress-bar"><div class="fill" id="statFill" style="width:0%"></div></div>
      </div>

      <div style="margin-top:32px;padding-top:20px;border-top:1px solid var(--line);">
        <div style="font-size:0.7rem;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-dim);margin-bottom:10px;">Zona de riesgo</div>
        <button class="btn" style="background:transparent;border:1px solid var(--bad);color:var(--bad);" id="deleteEventBtn">Eliminar evento</button>
      </div>
    </div>
  </div>

</main>

<div class="modal-bg" id="newEventModal">
  <div class="modal">
    <h2 id="eventModalTitle">Nuevo evento</h2>
    <div class="field">
      <label>Nombre del evento</label>
      <input type="text" id="newEventName" placeholder="Ej: Stoner del Litoral en Monkeys" autocomplete="off">
    </div>
    <div class="field" style="display:flex;gap:10px;">
      <div style="flex:1;">
        <label>Fecha</label>
        <input type="date" id="newEventFecha">
      </div>
      <div style="flex:1;">
        <label>Hora</label>
        <input type="time" id="newEventHora">
      </div>
    </div>
    <div class="field">
      <label>Lugar</label>
      <input type="text" id="newEventLugar" placeholder="Ej: Monkeys" autocomplete="off">
    </div>
    <div class="field" style="display:flex;gap:10px;">
      <div style="flex:1;">
        <label>Capacidad</label>
        <input type="number" id="newEventCapacidad" placeholder="100">
      </div>
      <div style="flex:1;">
        <label>Precio (ARS)</label>
        <input type="number" id="newEventPrecio" placeholder="15000">
      </div>
    </div>
    <div class="field">
      <label>Imagen o logo del evento (opcional)</label>
      <input type="file" id="newEventImagen" accept="image/*">
      <img id="newEventImagenPreview" style="display:none;width:100%;max-height:160px;object-fit:cover;border-radius:12px;margin-top:10px;">
    </div>
    <button class="btn btn-primary" id="createEventBtn">Crear evento</button>
    <button class="btn btn-ghost" id="cancelEventBtn" style="margin-top:10px;">Cancelar</button>
  </div>
</div>

<div class="modal-bg" id="confirmModal">
  <div class="modal">
    <h2 id="confirmTitle" style="color:var(--bad);">Confirmar</h2>
    <p id="confirmMsg" style="color:var(--ink-dim);font-size:0.9rem;margin:0 0 20px;line-height:1.5;"></p>
    <button class="btn" style="background:var(--bad);color:#fff;" id="confirmYesBtn">Eliminar</button>
    <button class="btn btn-ghost" id="confirmNoBtn" style="margin-top:10px;">Cancelar</button>
  </div>
</div>

<div id="toast"></div>

function genCode(){
  const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  let code = 'BRT-';
  for(let i=0;i<6;i++) code += chars.charAt(Math.floor(Math.random()*chars.length));

}

function computeStatus(eventDate){
  if(!eventDate) return {label:'Sin fecha', cls:'upcoming'};
  const now = Date.now();
  const opensAt = eventDate - SCAN_WINDOW_BEFORE_HOURS*3600000;
  const closesAt = eventDate + SCAN_WINDOW_AFTER_HOURS*3600000;
  if(now < opensAt) return {label:'Próximo', cls:'upcoming'};
  if(now > closesAt) return {label:'Finalizado', cls:'closed'};
  return {label:'En curso', cls:'live'};
}
function paintStatusPill(el, eventDate){
  const s = computeStatus(eventDate);
  el.textContent = s.label;
  el.className = 'status-pill '+s.cls;
}

function loadHome(){
  db.ref('eventos').once('value').then(snap=>{
    const data = snap.val() || {};
    eventsData = data;
    const ids = Object.keys(data).sort((a,b)=> (data[b].createdAt||0) - (data[a].createdAt||0));
    const listEl = document.getElementById('eventList');

    if(ids.length === 0){
      listEl.innerHTML = '<div class="empty-state"><div class="ic">🎫</div><div class="t">Todavía no creaste ningún evento.<br>Tocá "Nuevo evento" para arrancar.</div></div>';
      return;
    }

    listEl.innerHTML = ids.map(id => renderEventCard(id, data[id], null)).join('');
    ids.forEach(id=>{
      db.ref('tickets').orderByChild('eventoId').equalTo(id).once('value').then(tsnap=>{
        const tickets = Object.values(tsnap.val() || {});
        const card = document.getElementById('card-'+id);
        if(card) card.outerHTML = renderEventCard(id, data[id], tickets);
      });
    });
  });
}

function eventTimestamp(ev){
  if(!ev || !ev.fecha) return null;
  return new Date(ev.fecha+'T'+(ev.hora||'00:00')).getTime();
}

function renderEventCard(id, ev, tickets){
  const sold = tickets ? tickets.length : '—';
  const used = tickets ? tickets.filter(t=>t.usado).length : '—';
  const ts = eventTimestamp(ev);
  const status = computeStatus(ts);
  const paidCount = tickets ? tickets.filter(t=>!t.cortesia).length : null;
  const recaudado = (paidCount!==null && ev.precio) ? (paidCount * ev.precio) : null;
  const capText = ev.capacidad ? ' / '+ev.capacidad : '';
  const thumb = ev.imagen ? `<img src="${ev.imagen}" class="event-thumb">` : '';
  return `
    <div class="event-card" id="card-${id}" onclick="openEvent('${id}')">
      <div class="top-row">
        <div style="display:flex;gap:12px;align-items:flex-start;min-width:0;flex:1;">
          ${thumb}
          <div style="min-width:0;">
            <div class="ev-name">${ev.nombre || 'Sin nombre'}</div>
            <div class="ev-date">${ts ? fmtDateTime(ts) : 'Sin fecha'}${ev.lugar ? ' · '+ev.lugar : ''}</div>
          </div>
        </div>
        <span class="status-pill ${status.cls}">${status.label}</span>
      </div>
      <div class="metrics">
        <div class="metric"><div class="n">${sold}${capText}</div><div class="l">Vendidas</div></div>
        <div class="metric"><div class="n">${used}</div><div class="l">Ingresaron</div></div>
        ${recaudado!==null ? `<div class="metric"><div class="n">$${recaudado.toLocaleString('es-AR')}</div><div class="l">Recaudado</div></div>` : ''}
      </div>
    </div>
  `;
}

function compressImage(file, maxDim, quality){
  maxDim = maxDim || 640;
  quality = quality || 0.72;
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e)=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > h){ if(w > maxDim){ h = Math.round(h*maxDim/w); w = maxDim; } }
        else{ if(h > maxDim){ w = Math.round(w*maxDim/h); h = maxDim; } }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  const stubEl = document.querySelector('#ticketResult .stub');

});
async function shareCanvasAsTicket(el, info){
  if(!el || !info) return;
  try{
    const dataUrl = el.toDataURL ? el.toDataURL('image/png') : el.src;
    const blob = await (await fetch(dataUrl)).blob();
    const file = new File([blob], 'entrada.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file], title:'Entrada '+info.event, text:'Entrada para '+info.name+' — '+info.event});
    } else {
      toast('Tu navegador no soporta compartir imágenes, usá Descargar');
    }
  }catch(e){ console.error(e); }
}

async function resendTicket(ticketId, code, buyerName, cortesia){
  const holder = document.createElement('div');
  holder.style.position='fixed'; holder.style.left='-9999px'; holder.style.top='0';
  holder.innerHTML = `
    <div class="stub">
      ${currentEventImagen ? `<img src="${currentEventImagen}" style="width:72px;height:72px;border-radius:12px;object-fit:cover;margin:0 auto 12px;">` : ''}
      <div class="stub-event">${currentEventName}</div>
      <div class="stub-meta">${metaText(currentEventLugar, currentEventDate)}</div>
      ${cortesia ? '<span class="badge cortesia" style="display:inline-block;margin-bottom:12px;">Cortesía</span>' : ''}
      <div class="stub-buyer-label">Entrada de</div>
      <div class="stub-name">${buyerName}</div>
      <div class="resend-qr"></div>
      <div class="stub-divider"></div>
      <div class="stub-code mono">CÓDIGO ${code}</div>
    </div>
  `;
  document.body.appendChild(holder);
  new QRCode(holder.querySelector('.resend-qr'), {text: currentEventId+'::'+ticketId+'::'+code, width:200, height:200, colorDark:"#0b0d12", colorLight:"#ffffff"});
  await new Promise(r=>setTimeout(r,80)); // esperar a que la librería dibuje el canvas
  const stubEl = holder.querySelector('.stub');
  const canvas = await captureStub(stubEl);
  await shareCanvasAsTicket(canvas, {name:buyerName, code, event:currentEventName});
  document.body.removeChild(holder);
}

  if(!currentEventId) return;
  const n = buyersCache.length;
  showConfirm(
    'Eliminar evento',
    '¿Eliminar "'+currentEventName+'" y sus '+n+' entrada'+(n===1?'':'s')+'? Esta acción no se puede deshacer. Útil si el evento se cancela, se reprograma con otro registro, o para hacer una prueba.',
    deleteCurrentEvent
  );
});
function deleteCurrentEvent(){
  const eventId = currentEventId;
  const ticketIds = buyersCache.map(t=>t.id);
  Promise.all(ticketIds.map(id=> db.ref('tickets/'+id).remove()))
    .then(()=> db.ref('eventos/'+eventId).remove())
    .then(()=>{
      toast('Evento eliminado');
      goHome();
    })
    .catch(()=> toast('Error al eliminar el evento'));
}

// ================= CACHÉ OFFLINE PARA ESCANEAR =================
function cacheKey(eventId){ return 'entradas_cache_'+eventId; }
const PENDING_KEY = 'entradas_pendingSync';

function downloadEventCache(eventId){
  if(!eventId) return Promise.resolve();
  return db.ref('tickets').orderByChild('eventoId').equalTo(eventId).once('value').then(snap=>{
    localStorage.setItem(cacheKey(eventId), JSON.stringify(snap.val() || {}));
  }).catch(()=>{});
}
function getLocalCache(eventId){
  try{ return JSON.parse(localStorage.getItem(cacheKey(eventId)) || '{}'); }catch(e){ return {}; }
}
function getPendingQueue(){
  try{ return JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); }catch(e){ return []; }
}
function addToPendingQueue(entry){
  const q = getPendingQueue();
  q.push(entry);
  localStorage.setItem(PENDING_KEY, JSON.stringify(q));
  updatePendingBadge();
}
function updatePendingBadge(){
  const n = getPendingQueue().length;
  const badge = document.getElementById('pendingBadge');
  if(!badge) return;
  if(n > 0){ badge.style.display='inline'; badge.textContent = n+' sin sincronizar'; }
  else{ badge.style.display='none'; }
}
function flushPendingSync(){
  const q = getPendingQueue();
  if(!q.length) return;
  const remaining = [];
  let processed = 0;
  q.forEach(entry=>{
    db.ref('tickets/'+entry.ticketId)
      .update({usado:true, usadoAt: entry.usedAt})
      .then(()=>{ processed++; if(processed===q.length){ localStorage.setItem(PENDING_KEY, JSON.stringify(remaining)); updatePendingBadge(); toast('Sincronizado ✓'); } })
      .catch(()=>{ remaining.push(entry); processed++; if(processed===q.length){ localStorage.setItem(PENDING_KEY, JSON.stringify(remaining)); updatePendingBadge(); } });
  });
}

// ================= ESCANEAR =================
function scanWindowStatus(){
  if(!currentEventDate) return {allowed:false, reason:'noDate'};
  const now = Date.now();
  const opensAt = currentEventDate - SCAN_WINDOW_BEFORE_HOURS*3600000;
  const closesAt = currentEventDate + SCAN_WINDOW_AFTER_HOURS*3600000;
  if(now < opensAt) return {allowed:false, reason:'early', opensAt};
  if(now > closesAt) return {allowed:false, reason:'late', closesAt};
  return {allowed:true};
}
function updateScanLockUI(){
  const lockEl = document.getElementById('scanLock');
  const readerEl = document.getElementById('reader');
  const status = scanWindowStatus();
  if(status.allowed){ lockEl.style.display='none'; readerEl.style.display='block'; return true; }
  readerEl.style.display='none'; lockEl.style.display='block';
  document.getElementById('scanResult').style.display='none';
  document.getElementById('scanAgainBtn').style.display='none';
  const titleEl = document.getElementById('scanLockTitle');
  const subEl = document.getElementById('scanLockSub');
  if(status.reason==='noDate'){
    titleEl.textContent = 'Este evento no tiene fecha cargada';
    subEl.innerHTML = 'Editá el evento y agregale fecha y hora para poder escanear.';
  } else if(status.reason==='early'){
    titleEl.textContent = 'Todavía no es la hora';
    subEl.innerHTML = 'El escáner se habilita el <b>'+fmtDateTime(status.opensAt)+'</b>';
  } else if(status.reason==='late'){
    titleEl.textContent = 'La ventana de ingreso ya cerró';
    subEl.innerHTML = 'Este evento se cerró el <b>'+fmtDateTime(status.closesAt)+'</b>';
  }
  return false;
}
function startScanner(){
  if(scannerRunning) return;
  if(!updateScanLockUI()) return;
  if(isOnline) downloadEventCache(currentEventId);
  html5QrCode = new Html5Qrcode("reader");
  document.getElementById('scanResult').style.display='none';
  document.getElementById('scanAgainBtn').style.display='none';
  Html5Qrcode.getCameras().then(cams=>{
    if(!cams.length){ toast('No se encontró cámara'); return; }
    const camId = cams.find(c=>/back|rear|environment/i.test(c.label))?.id || cams[cams.length-1].id;
    html5QrCode.start(camId, {fps:10, qrbox:230}, onScanSuccess, ()=>{}).then(()=> scannerRunning = true);
  }).catch(()=> toast('No se pudo acceder a la cámara'));
}
function stopScanner(){
  if(html5QrCode && scannerRunning){
    return html5QrCode.stop().then(()=>{ scannerRunning = false; }).catch(()=>{ scannerRunning = false; });
  }
  return Promise.resolve();
}
function onScanSuccess(decodedText, decodedResult){
  if(!scannerRunning) return;
  const text = (typeof decodedText === 'object') ? decodedText.decodedText : decodedText;
  html5QrCode.pause();
  const parts = text.split('::');
  if(parts.length !== 3){ showScanResult(false, 'QR no reconocido', ''); return; }
  const [eventId, ticketId, code] = parts;
  if(isOnline) validateOnline(eventId, ticketId, code);
  else validateOffline(eventId, ticketId, code);
}
function validateOnline(eventId, ticketId, code){
  const ref = db.ref('tickets/'+ticketId);
  ref.once('value').then(snap=>{
    const t = snap.val();
    if(!t || t.codigo !== code || t.eventoId !== eventId){ showScanResult(false, 'Entrada no existe', 'Verificá con el comprador'); return; }
    if(t.usado){ showScanResult(false, 'Ya fue usada', t.comprador+' — ingresó antes'); return; }
    ref.update({usado:true, usadoAt: Date.now()}).then(()=>{ showScanResult(true, 'Entrada válida', t.comprador); });
  }).catch(()=>{ validateOffline(eventId, ticketId, code); });
}
function validateOffline(eventId, ticketId, code){
  const cache = getLocalCache(eventId);
  const t = cache[ticketId];
  if(!t || t.codigo !== code){ showScanResult(false, 'Entrada no existe', 'Sin señal — verificá con el comprador'); return; }
  if(t.usado){ showScanResult(false, 'Ya fue usada', t.comprador+' — ingresó antes (offline)'); return; }
  t.usado = true; t.usadoAt = Date.now();
  cache[ticketId] = t;
  localStorage.setItem(cacheKey(eventId), JSON.stringify(cache));
  addToPendingQueue({eventId, ticketId, usedAt: t.usadoAt});
  showScanResult(true, 'Entrada válida', t.comprador+' (sin señal, se sincroniza después)');
}
function showScanResult(ok, title, sub){
  const el = document.getElementById('scanResult');
  el.className = ok ? 'ok' : 'bad';
  el.innerHTML = (ok?'✅ ':'❌ ') + title + (sub?'<div class="sub">'+sub+'</div>':'');
  el.style.display = 'block';
  document.getElementById('scanAgainBtn').style.display = 'block';
}
document.getElementById('scanAgainBtn').addEventListener('click', ()=>{
  document.getElementById('scanResult').style.display='none';
  document.getElementById('scanAgainBtn').style.display='none';
  if(html5QrCode) html5QrCode.resume();
});

// ================= INIT =================
loadHome();
updatePendingBadge();
db.ref('.info/connected').on('value', snap=>{
  isOnline = !!snap.val();
  document.getElementById('connStatus').style.color = isOnline ? '#34d399' : '#ef4444';
  if(isOnline){
    flushPendingSync();
    if(currentEventId) downloadEventCache(currentEventId);
  }
});

// ================= SERVICE WORKER (app shell offline + instalación) =================
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}
